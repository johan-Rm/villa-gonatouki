            #     fields:
            #         - { type: 'group', label: '%group.label.basic.informations%', columns: 4 }
            #         - { property: 'isActive' }
            #         - { property: 'primaryImage', type: 'entity', label: '%label.primary_image%', type_options: { attr: { entity: 'MediaObject' }, required: false } }
