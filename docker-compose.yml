services:
  backend:
    build:
      context: ./digital-management-system
    container_name: villa_gonatouki_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./digital-management-system:/var/www/html  # 🔄 Bind mount pour développement : code live depuis l'hôte
      - ./nuxt-modern-website:/app  # 🔄 Bind mount du projet frontend (dev uniquement), permet au backend d’écrire dans le frontend
      - ./digital-management-system/public/uploads:/var/www/html/public/uploads  # 📂 Volume persistant pour les fichiers uploadés (images, documents…)
      - ./digital-management-system/public/media:/var/www/html/public/media  # 🖼 Volume persistant pour les médias générés (ex: cache LiipImagine)
      - ./nuxt-modern-website/update:/app/update  # 📁 Volume partagé pour les fichiers dynamiques que Symfony génère pour Nuxt (routes, payloads…)
      - ./nuxt-modern-website/lang:/app/lang  # 🌍 Volume partagé pour les fichiers de traduction `.json`, générés par Symfony, lus par Nuxt
      - ./nuxt-modern-website/lang/translations:/app/lang/translations  # 🌍 Volume partagé pour les fichiers de traduction `.json`, générés par Symfony, lus par Nuxt
    environment:
      - APP_ENV=dev
      - DATABASE_URL=mysql://${MYSQL_USER:-villa}:${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-dms_villa_gonatouki}
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
      - COMPOSER_MEMORY_LIMIT=-1
    ports:
      - "9003:9003"
    depends_on:
      - db
    networks:
      - villa_gonatouki

  frontend:
    build:
      context: ./nuxt-modern-website
    container_name: villa_gonatouki_frontend
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./nuxt-modern-website:/app  # 🔄 Bind mount pour développement : code live depuis l'hôte
      - ./nuxt-modern-website/update:/app/update  # 📁 Volume partagé avec le backend pour les fichiers dynamiques (ex: routes Nuxt)
      - ./nuxt-modern-website/lang:/app/lang  # 🌍 Volume partagé avec le backend pour les fichiers de traduction `.json`
      - ./digital-management-system/public/media/cache:/app/static/media/cache  # 🖼 Volume partagé : expose les images générées par Symfony dans le dossier statique Nuxt
      - ./digital-management-system/public/uploads:/app/static/media/uploads  # 🖼 Volume partagé : expose les images générées par Symfony dans le dossier statique Nuxt
      - /app/node_modules  # 🚫 Empêche la surcharge des node_modules de l’hôte      
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - villa_gonatouki

  db:
    image: mysql:8.0
    container_name: villa_gonatouki_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dms_villa_gonatouki}
      MYSQL_USER: ${MYSQL_USER:-villa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - villa_gonatouki

  nginx:
    image: nginx:alpine
    container_name: villa_gonatouki_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./digital-management-system:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - villa_gonatouki

  mailhog:
    image: mailhog/mailhog
    container_name: villa_gonatouki_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - villa_gonatouki

volumes:
  db_data:

networks:
  villa_gonatouki:
    driver: bridge
