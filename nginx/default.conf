server {
    listen 80;
    server_name localhost;

    client_max_body_size 64M;  # 🚀 Permet d'uploader des fichiers jusqu'à 64 Mo

    root /var/www/html/public;

    index index.php;

    # Sécurité de base
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Gérer les uploads (accès direct aux fichiers)
    location ~ ^/(uploads|media/files)/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Règle spécifique pour Liip Imagine
    # location ~ ^/media/cache/resolve/ {
    #     try_files $uri /index.php$is_args$args;
    # }

    # Cache Liip Imagine
    location ~ ^/media/cache/ {
        try_files $uri /index.php$is_args$args;
        expires 1M;
        access_log off;
    }

    # Fichiers statiques
    location ~* \.(?:css|js|webp|jpg|jpeg|gif|png|svg|ico|ttf|woff|woff2|json|map)$ {
        expires 1M;
        access_log off;
    }

    # Routing Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP via FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Bloque accès direct aux .php
    location ~ \.php$ {
        return 404;
    }

    # (optionnel) Proxy vers Nuxt si besoin
    # location /app/ {
    #     proxy_pass http://frontend:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
